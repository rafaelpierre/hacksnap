[project]
name = "hacksnap"
version = "0.1.0"
description = "Hourly article and discussion enrichment for the Hacksnap leaderboard"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "logfire[httpx,system-metrics]>=5.1.1",
  "modal>=1.5.5,<2",
  "pillow>=12.0,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "vercel==0.11.4",
]

[project.optional-dependencies]
editorial = [
    "openai-agents>=0.23.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
