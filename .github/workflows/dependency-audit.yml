name: Dependency audit

on:
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/uv.toml"
      - "**/.python-version"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/.npmrc"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/uv.toml"
      - "**/.python-version"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/.npmrc"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python / ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [data, hacksnap, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Export locked runtime and development dependencies
        run: >-
          uv export --locked --all-groups --all-extras --no-emit-project
          --no-hashes --format requirements-txt
          --output-file "$RUNNER_TEMP/audit-requirements.txt"
      - name: Audit Python dependencies
        # The export includes transitive dependencies; do not install project code.
        run: >-
          uvx --python 3.12 pip-audit --strict --no-deps --disable-pip
          --requirement "$RUNNER_TEMP/audit-requirements.txt"

  npm:
    name: npm / ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [cloudflare/scanner-tax, hacksnap/web]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit locked runtime and development dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=low
