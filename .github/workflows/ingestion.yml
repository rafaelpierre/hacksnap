name: Ingestion

on:
  pull_request:
    paths:
      - "data/**"
      - "hacksnap/web/lib/categories.ts"
      - "hacksnap/pipeline/supabase.py"
      - "hacksnap/web/package.json"
      - "hacksnap/web/package-lock.json"
      - ".github/workflows/ingestion.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "hacksnap/web/lib/categories.ts"
      - "hacksnap/pipeline/supabase.py"
      - "hacksnap/web/package.json"
      - "hacksnap/web/package-lock.json"
      - ".github/workflows/ingestion.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ingestion / tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - name: Install embedded PostgreSQL test runtime
        working-directory: hacksnap/web
        run: npm ci --ignore-scripts
      - run: uv sync --locked
      - name: Ingestion and database lifecycle tests
        env:
          HACKSNAP_TEST_PGLITE_MODULE: ${{ github.workspace }}/hacksnap/web/node_modules/@electric-sql/pglite/dist/index.js
        run: uv run pytest
