name: Supabase schema

on:
  pull_request:
    paths:
      - "data/migrations/**"
      - "data/alembic.ini"
      - "data/pyproject.toml"
      - "data/uv.lock"
      - ".github/workflows/supabase-schema.yml"
      - ".github/scripts/migrate-schema.sh"
      - ".github/tests/test_schema_deploy.py"
  push:
    branches: [main]
    paths:
      - "data/migrations/**"
      - "data/alembic.ini"
      - "data/pyproject.toml"
      - "data/uv.lock"
      - ".github/workflows/supabase-schema.yml"
      - ".github/scripts/migrate-schema.sh"
      - ".github/tests/test_schema_deploy.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      apply_migrations:
        description: Apply pending migrations before a validated worker deployment
        type: boolean
        default: false
    secrets:
      SUPABASE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Validate migration graph and application tests
        run: |
          uv run alembic heads
          uv run alembic history
          uv run pytest
          uv run python -m unittest discover -s ../.github/tests -p "test_schema_deploy.py"

  migrate:
    name: Apply schema migrations
    # Direct pushes validate only; the worker caller opts into migration after its checks.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || inputs.apply_migrations)
    needs: validate
    runs-on: ubuntu-latest
    environment: supabase-production
    concurrency:
      group: supabase-schema-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: data
    env:
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply Alembic migrations through the IPv4 pooler
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/scripts/migrate-schema.sh
