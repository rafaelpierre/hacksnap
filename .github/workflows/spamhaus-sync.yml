name: Sync Spamhaus DROP to Cloudflare

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without updating Cloudflare
        type: boolean
        default: true
  pull_request:
    paths: ["scripts/sync_spamhaus.py", "scripts/tests/test_sync_spamhaus.py", ".github/workflows/spamhaus-sync.yml"]
  push:
    branches: [main]
    paths: ["scripts/sync_spamhaus.py", "scripts/tests/test_sync_spamhaus.py", ".github/workflows/spamhaus-sync.yml"]

permissions:
  contents: read

concurrency:
  group: spamhaus-cloudflare-sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v

  sync:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPAMHAUS_SYNC_ENABLED: ${{ secrets.SPAMHAUS_SYNC_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - name: Validate feeds and synchronize dedicated list
        if: github.event_name == 'workflow_dispatch' || env.SPAMHAUS_SYNC_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SPAMHAUS_LIST_ID: ${{ secrets.CLOUDFLARE_LIST_ID }}
          CLOUDFLARE_LISTS_API_TOKEN: ${{ secrets.CLOUDFLARE_LISTS_API_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python3 scripts/sync_spamhaus.py --apply
          else
            python3 scripts/sync_spamhaus.py
          fi
