name: Hacksnap

on:
  pull_request:
    paths: ["hacksnap/**", "data/**", ".github/workflows/hacksnap.yml"]
  push:
    branches: [main]
    paths: ["hacksnap/**", "data/**", ".github/workflows/hacksnap.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - name: Worker tests and lint
        working-directory: hacksnap
        run: |
          uv sync --locked
          uv run ruff check pipeline tests modal_app.py
          uv run pytest
          uv run python -c 'import modal_app'
      - name: Ingestion regression tests and migration SQL
        working-directory: data
        env:
          SUPABASE_PASSWORD: offline-test-only
        run: |
          uv sync --locked
          uv run pytest
          uv run alembic upgrade head --sql > "$RUNNER_TEMP/hacksnap-schema.sql"
      - name: Database behavior and production web build
        working-directory: hacksnap/web
        env:
          HACKSNAP_SCHEMA_SQL: ${{ runner.temp }}/hacksnap-schema.sql
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run test:db
          npm run test:history
          npm run test:api
          npm run test:categories
          npm run test:archive
          npm run test:metadata
          npm run test:theme
          npm run typecheck
          npm run build
          export HACKSNAP_WEB_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/postgres
          node tests/preview-db.mjs > "$RUNNER_TEMP/hacksnap-preview-db.log" 2>&1 &
          preview_db_pid=$!
          trap 'kill "$preview_db_pid" ${preview_web_pid:-} 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { Pool } from 'pg';
          const pool = new Pool({connectionString: process.env.HACKSNAP_WEB_DATABASE_URL});
          try {
            for (let attempt = 0; ; attempt++) {
              try { await pool.query('SELECT 1'); break; }
              catch (error) {
                if (attempt >= 59) throw error;
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }
          } finally { await pool.end(); }
          JS
          npm start -- --port 3100 > "$RUNNER_TEMP/hacksnap-preview-web.log" 2>&1 &
          preview_web_pid=$!
          node --input-type=module <<'JS'
          for (let attempt = 0; ; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:3100/');
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              break;
            } catch (error) {
              if (attempt >= 59) throw error;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }
          JS
          HACKSNAP_TEST_URL=http://127.0.0.1:3100 HACKSNAP_TEST_STORY_ID=90000001 node --test tests/markdown-http.test.mjs
          HACKSNAP_TEST_URL=http://127.0.0.1:3100 node --test tests/categories-http.test.mjs
          HACKSNAP_TEST_URL=http://127.0.0.1:3100 node --test tests/ux-acceptance-http.test.mjs

  deploy:
    # Production changes require an explicit manual workflow run.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: hacksnap-production
    concurrency:
      group: hacksnap-modal-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the schema deployment has completed
        working-directory: data
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          uv sync --locked
          uv run python - <<'PY'
          import psycopg
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from hn_trending.cli import resolve_database_url
          expected = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          with psycopg.connect(resolve_database_url(), connect_timeout=10) as connection:
              connection.execute("SET TRANSACTION READ ONLY")
              connection.execute("SET LOCAL statement_timeout = '10s'")
              versions = {row[0] for row in connection.execute("SELECT version_num FROM alembic_version")}
              if versions != expected:
                  raise SystemExit("Run the existing Supabase schema workflow, then rerun Hacksnap deployment.")
          PY
      - name: Deploy the scheduled Modal function
        working-directory: hacksnap
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv sync --locked --no-dev
          uv run modal deploy modal_app.py
