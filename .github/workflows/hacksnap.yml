name: Hacksnap

on:
  pull_request:
    paths:
      - "hacksnap/**"
      - "!hacksnap/web/**"
      - ".github/workflows/hacksnap.yml"
      - ".github/scripts/deploy-modal.sh"
      - ".github/scripts/migrate-schema.sh"
      - ".github/tests/test_schema_deploy.py"
      - ".github/workflows/supabase-schema.yml"
      - ".github/tests/test_modal_deploy.py"
      - ".github/scripts/modal-deploy-changes.py"
      - ".github/tests/test_modal_deploy_changes.py"
  push:
    branches: [main]
    paths:
      - "hacksnap/**"
      - "!hacksnap/web/**"
      - ".github/workflows/hacksnap.yml"
      - ".github/scripts/deploy-modal.sh"
      - ".github/scripts/migrate-schema.sh"
      - ".github/tests/test_schema_deploy.py"
      - ".github/workflows/supabase-schema.yml"
      - ".github/tests/test_modal_deploy.py"
      - ".github/scripts/modal-deploy-changes.py"
      - ".github/tests/test_modal_deploy_changes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment_changes:
    name: Deployment changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check production changes across the full push
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/modal-deploy-changes.py

  test:
    name: Worker / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, tests]
    defaults:
      run:
        working-directory: hacksnap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        if: matrix.check == 'tests'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - name: Install embedded PostgreSQL test runtime
        if: matrix.check == 'tests'
        working-directory: hacksnap/web
        run: npm ci --ignore-scripts
      - name: Worker lint
        if: matrix.check == 'lint'
        run: uv run ruff check pipeline tests modal_app.py ../.github/tests ../.github/scripts/modal-deploy-changes.py
      - name: Worker tests and import smoke check
        if: matrix.check == 'tests'
        env:
          HACKSNAP_TEST_PGLITE_MODULE: ${{ github.workspace }}/hacksnap/web/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          uv run python -m unittest discover -s ../.github/tests -p "test_*.py"
          uv run pytest
          uv run python -c 'import modal_app'

  # Automatic and manual production deployments share all validation gates.
  ingestion:
    needs: deployment_changes
    if: needs.deployment_changes.outputs.deploy == 'true'
    uses: ./.github/workflows/ingestion.yml

  frontend:
    needs: deployment_changes
    if: needs.deployment_changes.outputs.deploy == 'true'
    uses: ./.github/workflows/frontend.yml

  schema:
    needs: [deployment_changes, test, ingestion, frontend]
    if: needs.deployment_changes.outputs.deploy == 'true'
    uses: ./.github/workflows/supabase-schema.yml
    with:
      apply_migrations: true
    secrets:
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

  deploy:
    # Deploy matching main pushes and explicit manual runs after all checks pass.
    if: needs.deployment_changes.outputs.deploy == 'true'
    needs: [deployment_changes, test, ingestion, frontend, schema]
    runs-on: ubuntu-latest
    environment: hacksnap-production
    concurrency:
      group: hacksnap-modal-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the schema deployment has completed
        working-directory: data
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          uv sync --locked
          uv run python - <<'PY'
          import psycopg
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from hn_trending.cli import resolve_database_url
          expected = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          with psycopg.connect(resolve_database_url(), connect_timeout=10) as connection:
              connection.execute("SET TRANSACTION READ ONLY")
              connection.execute("SET LOCAL statement_timeout = '10s'")
              versions = {row[0] for row in connection.execute("SELECT version_num FROM alembic_version")}
              if versions != expected:
                  raise SystemExit("Schema version differs after migration; inspect the schema job before starting a new Hacksnap run on main.")
          PY
      - name: Deploy the scheduled Modal function
        working-directory: hacksnap
        env:
          GH_TOKEN: ${{ github.token }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: bash ../.github/scripts/deploy-modal.sh
