name: Hacksnap

on:
  pull_request:
    paths:
      - "hacksnap/**"
      - "!hacksnap/web/**"
      - ".github/workflows/hacksnap.yml"
  push:
    branches: [main]
    paths:
      - "hacksnap/pipeline/**"
      - "hacksnap/modal_app.py"
      - "hacksnap/pyproject.toml"
      - "hacksnap/uv.lock"
      - ".github/workflows/hacksnap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Worker / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, tests]
    defaults:
      run:
        working-directory: hacksnap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Worker lint
        if: matrix.check == 'lint'
        run: uv run ruff check pipeline tests modal_app.py
      - name: Worker tests and import smoke check
        if: matrix.check == 'tests'
        run: |
          uv run pytest
          uv run python -c 'import modal_app'

  # Automatic and manual production deployments share all validation gates.
  ingestion:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/ingestion.yml

  frontend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/frontend.yml

  deploy:
    # Deploy matching main pushes and explicit manual runs after all checks pass.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, ingestion, frontend]
    runs-on: ubuntu-latest
    environment: hacksnap-production
    concurrency:
      group: hacksnap-modal-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify the schema deployment has completed
        working-directory: data
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          uv sync --locked
          uv run python - <<'PY'
          import psycopg
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from hn_trending.cli import resolve_database_url
          expected = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          with psycopg.connect(resolve_database_url(), connect_timeout=10) as connection:
              connection.execute("SET TRANSACTION READ ONLY")
              connection.execute("SET LOCAL statement_timeout = '10s'")
              versions = {row[0] for row in connection.execute("SELECT version_num FROM alembic_version")}
              if versions != expected:
                  raise SystemExit("Run the existing Supabase schema workflow, then rerun Hacksnap deployment.")
          PY
      - name: Deploy the scheduled Modal function
        working-directory: hacksnap
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv sync --locked --no-dev
          uv run modal deploy modal_app.py
