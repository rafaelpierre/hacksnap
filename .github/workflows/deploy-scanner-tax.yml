name: Deploy scanner-tax Worker

on:
  pull_request:
    paths: ["cloudflare/scanner-tax/**", ".github/workflows/deploy-scanner-tax.yml"]
  push:
    branches: [main]
    paths: ["cloudflare/scanner-tax/**", ".github/workflows/deploy-scanner-tax.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/scanner-tax
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/scanner-tax/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: scanner-tax-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare/scanner-tax
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/scanner-tax/package-lock.json
      - run: npm ci
      - name: Deploy Worker and route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_WORKERS_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_WORKERS_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_WORKERS_ACCOUNT_ID repository secret}"
          npm run deploy
