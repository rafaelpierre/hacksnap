name: Frontend

on:
  pull_request:
    paths:
      - "hacksnap/web/**"
      - "hacksnap/fixtures/**"
      - "data/migrations/versions/0012_discussion_analysis.py"
      - "data/migrations/versions/0018_discussion_themes_schema.py"
      - "data/migrations/versions/0019_story_popularity.py"
      - "data/migrations/versions/0020_story_popularity_activation.py"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/frontend-changes.py"
      - ".github/tests/test_frontend_changes.py"
  push:
    branches: [main]
    paths:
      - "hacksnap/web/**"
      - "hacksnap/fixtures/**"
      - "data/migrations/versions/0012_discussion_analysis.py"
      - "data/migrations/versions/0018_discussion_themes_schema.py"
      - "data/migrations/versions/0019_story_popularity.py"
      - "data/migrations/versions/0020_story_popularity_activation.py"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/frontend-changes.py"
      - ".github/tests/test_frontend_changes.py"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called workflows inherit the caller's name; the prefix keeps their locks distinct.
# Non-PR runs retain independent validation for each production revision.
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Frontend / browser selection
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
          # Include the merge commit's base parent for a complete PR diff.
          fetch-depth: 2
      - name: Verify browser selection rules
        run: python3 -m unittest discover -s .github/tests -p test_frontend_changes.py
      - name: Select browser checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/frontend-changes.py

  check:
    name: Frontend / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, build]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint (Oxlint)
        if: matrix.check == 'lint'
        run: npm run lint
      - name: Formatting (Oxfmt)
        if: matrix.check == 'format'
        run: npm run format:check
      - name: Typecheck and production build
        if: matrix.check == 'build'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm run build

  test-shard:
    name: Frontend / Jest shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Unit and component tests (Jest)
        run: npm run test:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  tests:
    name: Frontend / tests
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Jest shard to pass
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARD_RESULT" = success

  browser-shard:
    name: Frontend / Chromium shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      # Keep this version aligned with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build fixture app
        run: npm run browser:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Deterministic browser regression suite
        run: npm run test:browser:shard -- ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Browser screenshots, traces and route measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-results-${{ matrix.shard }}
          path: |
            hacksnap/web/playwright-report/
            hacksnap/web/test-results/
          retention-days: 14

  browser:
    name: Frontend / production browser
    needs: [changes, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Chromium shards or an explicit non-runtime change
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: |
          case "$SELECTION_RESULT:$BROWSER_REQUIRED:$SHARD_RESULT" in
            success:true:success|success:false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  iphone-browser-shard:
    name: Frontend / iPhone WebKit shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # Exercise Apple's WebKit port; Linux WebKit has different networking behavior.
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build fixture app while installing WebKit
        run: |
          npm run browser:build &
          build_pid=$!
          npx playwright install webkit
          wait "$build_pid"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: iPhone history regressions
        run: npm run test:browser -- --project=iphone-webkit --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: iPhone screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-iphone-browser-results-${{ matrix.shard }}
          path: |
            hacksnap/web/playwright-report/
            hacksnap/web/test-results/
          retention-days: 14

  iphone-browser:
    name: Frontend / iPhone WebKit
    needs: [changes, iphone-browser-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all iPhone shards or an explicit non-runtime change
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          SHARD_RESULT: ${{ needs.iphone-browser-shard.result }}
        run: |
          case "$SELECTION_RESULT:$BROWSER_REQUIRED:$SHARD_RESULT" in
            success:true:success|success:false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
