name: Frontend

on:
  pull_request:
    paths:
      - "hacksnap/web/**"
      - "hacksnap/fixtures/**"
      - "data/migrations/versions/0012_discussion_analysis.py"
      - "data/migrations/versions/0018_discussion_themes_schema.py"
      - "data/migrations/versions/0019_story_popularity.py"
      - "data/migrations/versions/0020_story_popularity_activation.py"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "hacksnap/web/**"
      - "hacksnap/fixtures/**"
      - "data/migrations/versions/0012_discussion_analysis.py"
      - "data/migrations/versions/0018_discussion_themes_schema.py"
      - "data/migrations/versions/0019_story_popularity.py"
      - "data/migrations/versions/0020_story_popularity_activation.py"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called workflows inherit the caller's name; the prefix keeps their locks distinct.
# Non-PR runs retain independent validation for each production revision.
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Frontend / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, build]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint (Oxlint)
        if: matrix.check == 'lint'
        run: npm run lint
      - name: Formatting (Oxfmt)
        if: matrix.check == 'format'
        run: npm run format:check
      - name: Typecheck and production build
        if: matrix.check == 'build'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm run build

  test-shard:
    name: Frontend / Jest shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Unit and component tests (Jest)
        run: npm run test:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  tests:
    name: Frontend / tests
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Jest shard to pass
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARD_RESULT" = success

  browser-shard:
    name: Frontend / Chromium shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build fixture app while installing Chromium
        run: |
          npm run browser:build &
          build_pid=$!
          npx playwright install --with-deps --only-shell chromium
          wait "$build_pid"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Deterministic browser regression suite
        run: npm run test:browser -- --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Browser screenshots, traces and route measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-results-${{ matrix.shard }}
          path: |
            hacksnap/web/playwright-report/
            hacksnap/web/test-results/
          retention-days: 14

  browser:
    name: Frontend / production browser
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Chromium shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SHARD_RESULT" = success

  iphone-browser-shard:
    name: Frontend / iPhone WebKit shard ${{ matrix.shard }}/${{ strategy.job-total }}
    # Exercise Apple's WebKit port; Linux WebKit has different networking behavior.
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build fixture app while installing WebKit
        run: |
          npm run browser:build &
          build_pid=$!
          npx playwright install webkit
          wait "$build_pid"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: iPhone history regressions
        run: npm run test:browser -- --project=iphone-webkit --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: iPhone screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-iphone-browser-results-${{ matrix.shard }}
          path: |
            hacksnap/web/playwright-report/
            hacksnap/web/test-results/
          retention-days: 14

  iphone-browser:
    name: Frontend / iPhone WebKit
    needs: iphone-browser-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every iPhone WebKit shard to pass
        env:
          SHARD_RESULT: ${{ needs.iphone-browser-shard.result }}
        run: test "$SHARD_RESULT" = success
