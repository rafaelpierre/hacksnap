name: Frontend

on:
  pull_request:
    paths:
      - "hacksnap/web/**"
      - "hacksnap/fixtures/**"
      - "data/migrations/versions/0012_discussion_analysis.py"
      - "data/migrations/versions/0018_discussion_themes_schema.py"
      - "data/migrations/versions/0019_story_popularity.py"
      - "data/migrations/versions/0020_story_popularity_activation.py"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "hacksnap/web/**"
      - "hacksnap/fixtures/**"
      - "data/migrations/versions/0012_discussion_analysis.py"
      - "data/migrations/versions/0018_discussion_themes_schema.py"
      - "data/migrations/versions/0019_story_popularity.py"
      - "data/migrations/versions/0020_story_popularity_activation.py"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Frontend / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, tests, build]
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci
      - name: Lint (Oxlint)
        if: matrix.check == 'lint'
        run: npm run lint
      - name: Formatting (Oxfmt)
        if: matrix.check == 'format'
        run: npm run format:check
      - name: Unit and component tests (Jest)
        if: matrix.check == 'tests'
        run: npm run test:ci
      - name: Typecheck and production build
        if: matrix.check == 'build'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run typecheck
          npm run build

  browser:
    name: Frontend / production browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hacksnap/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hacksnap/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Production build and deterministic browser regression suite
        run: npm run test:browser:ci
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Browser screenshots, traces and route measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: |
            hacksnap/web/playwright-report/
            hacksnap/web/test-results/
          retention-days: 14
