name: Hacker News ingestion

on:
  schedule:
    # Every hour at minute 17 UTC; avoids the heavily contended top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Fetch and store trending threads
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: hacker-news-ingestion
      cancel-in-progress: false
    defaults:
      run:
        working-directory: data
    env:
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch and store Hacker News threads
        run: |
          test -n "$SUPABASE_PASSWORD"
          uv run hn-trending \
            --limit 20 \
            --min-points 20 \
            --min-comments 20 \
            --max-comment-depth 1
