[project]
name = "hacker-news-threads-mcp"
version = "0.1.0"
description = "Read-only MCP server for persisted Hacker News threads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
hn-threads-mcp = "hn_threads_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hn_threads_mcp"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
