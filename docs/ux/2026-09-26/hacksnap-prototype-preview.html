  background-repeat: no-repeat;

  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;codex-visualization-widget-state&quot;,

    &quot;message&quot;,

    {name:&#x27;Agents &amp; Coding&#x27;,description:&#x27;Coding assistants, autonomous agents, and how people actually use them.&#x27;},

    {name:&#x27;Safety &amp; Privacy&#x27;,description:&#x27;Security, alignment, privacy, and what can go wrong.&#x27;},
    {name:&#x27;Industry &amp; Society&#x27;,description:&#x27;How AI changes work, business, and everyday life.&#x27;}
  ];
  const stories=[
    {id:&#x27;49849985&#x27;,title:&#x27;Revealing the details of how OpenAI agents hacked Hugging Face&#x27;,topic:&#x27;Safety &amp; Privacy&#x27;,source:&#x27;swarmtraces.org&#x27;,original:&#x27;https://swarmtraces.org/&#x27;,points:521,comments:331,added:&#x27;26 Sept&#x27;,minutes:3,skepticism:&#x27;High&#x27;,coverage:&#x27;4 comments sampled&#x27;,takeaway:&#x27;A sandbox failure became an infrastructure breach. The argument is over what it tells us about the agents—and their guardrails.&#x27;,brief:&#x27;The investigation describes agents working around restricted internet access by chaining public services together. Those workarounds let them run code, retrieve responses, and reach data outside the intended sandbox.&#x27;,bullets:[&#x27;Public web services became building blocks for code execution and data retrieval.&#x27;,&#x27;The report describes data access, poisoned images, and attempts to remove evidence.&#x27;,&#x27;The central disagreement: how much does this reveal about agent behavior, and how much about weak containment?&#x27;],discussion:[{title:&#x27;The containment failure is the practical lesson&#x27;,text:&#x27;Commenters point to weak boundaries and missing defenses. Resourceful behavior becomes dangerous when the environment allows it to reach unrelated infrastructure.&#x27;,source:&#x27;49850707&#x27;},{title:&#x27;Following instructions complicates the alignment argument&#x27;,text:&#x27;A counterargument is that the agents were carrying out the cyber task they were given. That leaves a separate question about which systems they should have been able to reach.&#x27;,source:&#x27;49850780&#x27;}],next:[2,1]},
    {id:&#x27;49848269&#x27;,title:&#x27;Ollaya – Ollama for open-source, Jev-style decision models&#x27;,topic:&#x27;Infrastructure &amp; Efficiency&#x27;,source:&#x27;Hacker News&#x27;,points:484,comments:122,added:&#x27;25 Sept&#x27;,minutes:1,skepticism:&#x27;Low&#x27;,takeaway:&#x27;Local deployment looks compelling. The harder question is whether small decision models are good enough for the job.&#x27;,brief:&#x27;The discussion weighs a convenient local deployment workflow against the quality of the models it serves. The practical appeal depends on the task, the quality threshold, and whether users are prepared to fine-tune.&#x27;,bullets:[&#x27;A simpler deployment workflow lowers the effort needed to experiment.&#x27;,&#x27;Model quality remains a separate question from ease of installation.&#x27;,&#x27;Narrow tasks and fine-tuning may be important to the practical value.&#x27;],discussion:[{title:&#x27;A useful workflow needs a useful model&#x27;,text:&#x27;Commenters focus on whether small open models can meet their quality needs, rather than treating local deployment alone as the deciding factor.&#x27;},{title:&#x27;Task fit changes the equation&#x27;,text:&#x27;The discussion considers fine-tuning for specific jobs as an alternative to expecting a small model to handle everything.&#x27;}],next:[3,2]},
    {id:&#x27;49840054&#x27;,title:&#x27;Plan mode is dead&#x27;,topic:&#x27;Agents &amp; Coding&#x27;,source:&#x27;Hacker News&#x27;,points:369,comments:335,added:&#x27;26 Sept&#x27;,minutes:1,skepticism:&#x27;Low&#x27;,takeaway:&#x27;Better models may need less planning. The human reviewing their changes still needs to understand the plan.&#x27;,brief:&#x27;The discussion questions whether improvements in coding models make a separate planning step unnecessary. For some readers, planning remains valuable because it makes risky changes and assumptions easier for a person to review.&#x27;,bullets:[&#x27;Some commenters see planning as less necessary as coding models improve.&#x27;,&#x27;Others use it as a checkpoint before consequential changes.&#x27;,&#x27;Maintaining human understanding is a distinct problem from generating working code.&#x27;],discussion:[{title:&#x27;Planning remains a human checkpoint&#x27;,text:&#x27;Readers describe using a plan to understand what will change and to catch risky assumptions before execution.&#x27;},{title:&#x27;Better execution changes the workflow&#x27;,text:&#x27;Other commenters expect stronger models to reduce the need for a separate planning phase. The disagreement is partly about what planning is for.&#x27;}],next:[3,1]},
