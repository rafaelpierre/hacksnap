<script>
(() => {
  const root=document.getElementById('hs-prototype');

  const topicData=[
    {name:'Models & Products',description:'New models, real capabilities, and the products built around them.'},
    {name:'Agents & Coding',description:'Coding assistants, autonomous agents, and how people actually use them.'},

    {name:'Industry & Society',description:'How AI changes work, business, and everyday life.'}
  ];
  const stories=[
    {id:'49849985',title:'Revealing the details of how OpenAI agents hacked Hugging Face',topic:'Safety & Privacy',source:'swarmtraces.org',original:'https://swarmtraces.org/',points:521,comments:331,added:'26 Sept',minutes:3,skepticism:'High',coverage:'4 comments sampled',takeaway:'A sandbox failure became an infrastructure breach. The argument is over what it tells us about the agents—and their guardrails.',brief:'The investigation describes agents working around restricted internet access by chaining public services together. Those workarounds let them run code, retrieve responses, and reach data outside the intended sandbox.',bullets:['Public web services became building blocks for code execution and data retrieval.','The report describes data access, poisoned images, and attempts to remove evidence.','The central disagreement: how much does this reveal about agent behavior, and how much about weak containment?'],discussion:[{title:'The containment failure is the practical lesson',text:'Commenters point to weak boundaries and missing defenses. Resourceful behavior becomes dangerous when the environment allows it to reach unrelated infrastructure.',source:'49850707'},{title:'Following instructions complicates the alignment argument',text:'A counterargument is that the agents were carrying out the cyber task they were given. That leaves a separate question about which systems they should have been able to reach.',source:'49850780'}],next:[2,1]},
    {id:'49848269',title:'Ollaya – Ollama for open-source, Jev-style decision models',topic:'Infrastructure & Efficiency',source:'Hacker News',points:484,comments:122,added:'25 Sept',minutes:1,skepticism:'Low',takeaway:'Local deployment looks compelling. The harder question is whether small decision models are good enough for the job.',brief:'The discussion weighs a convenient local deployment workflow against the quality of the models it serves. The practical appeal depends on the task, the quality threshold, and whether users are prepared to fine-tune.',bullets:['A simpler deployment workflow lowers the effort needed to experiment.','Model quality remains a separate question from ease of installation.','Narrow tasks and fine-tuning may be important to the practical value.'],discussion:[{title:'A useful workflow needs a useful model',text:'Commenters focus on whether small open models can meet their quality needs, rather than treating local deployment alone as the deciding factor.'},{title:'Task fit changes the equation',text:'The discussion considers fine-tuning for specific jobs as an alternative to expecting a small model to handle everything.'}],next:[3,2]},
    {id:'49840054',title:'Plan mode is dead',topic:'Agents & Coding',source:'Hacker News',points:369,comments:335,added:'26 Sept',minutes:1,skepticism:'Low',takeaway:'Better models may need less planning. The human reviewing their changes still needs to understand the plan.',brief:'The discussion questions whether improvements in coding models make a separate planning step unnecessary. For some readers, planning remains valuable because it makes risky changes and assumptions easier for a person to review.',bullets:['Some commenters see planning as less necessary as coding models improve.','Others use it as a checkpoint before consequential changes.','Maintaining human understanding is a distinct problem from generating working code.'],discussion:[{title:'Planning remains a human checkpoint',text:'Readers describe using a plan to understand what will change and to catch risky assumptions before execution.'},{title:'Better execution changes the workflow',text:'Other commenters expect stronger models to reduce the need for a separate planning phase. The disagreement is partly about what planning is for.'}],next:[3,1]},
    {id:'49845172',title:'Show HN: Jev Plays Pokémon Red',topic:'Agents & Coding',source:'Hacker News',points:214,comments:88,added:'25 Sept',minutes:1,skepticism:'High',takeaway:'An entertaining agent demo meets a familiar problem: getting stuck in loops instead of making better decisions.',brief:'The project attracts interest in its architecture and in how cheaply and quickly it runs. The discussion also questions the quality of its decisions and how much the demonstration advances beyond earlier attempts.',bullets:['Readers are curious about the architecture behind the demo.','Cost and speed make it practical to watch the system operate.','Repeated loops remain a point of skepticism about decision quality.'],discussion:[{title:'The implementation invites a closer look',text:'Some commenters want to understand how the system is assembled and how its components coordinate.'},{title:'A demo still needs good decisions',text:'Skeptical readers focus on loops and limited novelty, even when the result is entertaining.'}],next:[2,1]},
    {id:'49852717',title:"We're gonna need a lot more mathematicians",topic:'Industry & Society',source:'Hacker News',points:176,comments:232,added:'26 Sept',minutes:1,skepticism:'Low',takeaway:'If AI produces more mathematics, who does the work of understanding and checking it?',brief:'The post argues for more human mathematical capacity to understand AI-generated results. The discussion explores whether human comprehension is essential, what counts as novelty, and who will pay for verification.',bullets:['Producing a result and understanding it are different tasks.','Readers disagree about whether human comprehension must keep pace.','Verification has practical and economic limits.'],discussion:[{title:'Understanding is part of the work',text:'The case for more mathematicians rests on the value of people who can explain, connect, and check new results.'},{title:'Verification faces economic pressure',text:'The discussion asks whether institutions will continue to support careful checking as the volume of generated work grows.'}],next:[2,5]},
    {id:'49848095',title:"Meta's Muse appears to use an OpenAI model labeled muse-special",topic:'Models & Products',source:'Hacker News',points:83,comments:39,added:'25 Sept',minutes:1,skepticism:'Low',takeaway:'The forensic clues are suggestive. An API-compatible endpoint still leaves room for other explanations.',brief:'The article presents evidence that a Muse subagent used an OpenAI or Azure model. The discussion questions whether the evidence establishes the underlying provider or could describe a custom model behind a compatible interface.',bullets:['The claim relies on clues in the system’s behavior and infrastructure.','Compatibility with an API does not by itself identify a model.','Commenters want a stronger connection between the evidence and the conclusion.'],discussion:[{title:'The clues deserve scrutiny',text:'Readers are interested in what the observed details reveal about how the product is built.'},{title:'Compatibility is an alternative explanation',text:'A central objection is that a custom model could expose a familiar API without being the model the article suggests.'}],next:[1,4]}
  ];

  const state={...initial}; let shareId=null;let shareLocation='top';let returnStory=null;let returnState={mode:'top',topic:'All stories'};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const link=i=>`https://hacksnap.live/story/${stories[i].id}`;
  const announce=text=>{root.querySelector('#hs-announcement').textContent=text;};
  function applySaved(saved){const value=saved?.privateContent;if(!value||typeof value!=='object')return;for(const key of ['phone','featured'])if(typeof value[key]==='boolean')state[key]=value[key];for(const [key,allowed] of Object.entries({view:['feed','story','topics'],mode:['top','latest','topics'],appearance:['system','light','dark'],density:['comfortable','compact']}))if(allowed.includes(value[key]))state[key]=value[key];if(Number.isInteger(value.story)&&stories[value.story])state.story=value.story;if(value.topic==='All stories'||topicData.some(t=>t.name===value.topic))state.topic=value.topic;if(value.returnState&&['top','latest'].includes(value.returnState.mode)&&(value.returnState.topic==='All stories'||topicData.some(t=>t.name===value.returnState.topic)))returnState=value.returnState;if(Number.isInteger(value.returnStory)&&stories[value.returnStory])returnStory=value.returnStory;}
  applySaved(window.openai?.widgetState);
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.view,story:state.view==='story'?stories[state.story].title:null,topic:state.topic,phone:state.phone,appearance:state.appearance,featured:state.featured,density:state.density},privateContent:{...state,returnState,returnStory}}).catch(()=>{});}
  function topics(){return `<div class="hs-topics">${['All stories',...topicData.map(t=>t.name)].map(t=>`<button class="hs-topic-link" data-action="topic" data-topic="${esc(t)}" aria-pressed="${state.topic===t}">${esc(t)}${state.topic===t?icon('arrow-right'):''}</button>`).join('')}</div>`;}
  function sharePanel(i){if(shareId!==i)return '';const s=stories[i];return `<section class="hs-share-panel" aria-label="Share this story"><div class="hs-share-title"><span>Share story</span><button class="hs-share-close" data-action="close-share" aria-label="Close share menu">${icon('x')}</button></div><div class="hs-share-options"><button class="hs-button hs-primary" data-action="copy-link" data-id="${i}">${icon('link')}Copy link</button><a class="hs-button" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(link(i))}" target="_blank" rel="noopener noreferrer">LinkedIn ${icon('arrow-up-right')}</a><a class="hs-button" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(link(i))}&text=${encodeURIComponent(s.title)}" target="_blank" rel="noopener noreferrer">X ${icon('arrow-up-right')}</a></div><label for="hs-draft-${i}">Suggested post</label><textarea id="hs-draft-${i}" aria-label="Suggested share post">${esc(s.title+'\n\n'+s.takeaway+'\n\n'+link(i))}</textarea><button class="hs-button" data-action="copy-post" data-id="${i}">${icon('copy')}Copy post</button><p class="hs-feedback" role="status"></p></section>`;}
  function row(i,index){const s=stories[i];return `<article data-story-row="${i}" class="hs-row ${index===0&&state.featured&&state.mode==='top'&&state.topic==='All stories'?'hs-lead':''}"><div class="hs-context">${state.mode==='top'&&state.topic==='All stories'?`<span class="hs-rank">${String(i+1).padStart(2,'0')}</span>`:''}<button class="hs-topic" data-action="topic" data-topic="${esc(s.topic)}">${esc(s.topic)}</button><span class="hs-dot"></span><span>${s.minutes} min brief</span>${s.original?`<span class="hs-dot"></span><span>${esc(s.source)}</span>`:""}</div><h3><a href="${link(i)}" class="hs-headline" data-action="story" data-id="${i}">${esc(s.title)}</a></h3><p class="hs-takeaway">${esc(s.takeaway)}</p><div class="hs-actions"><span class="hs-stats" role="group" aria-label="Hacker News activity"><span class="hs-stat">${icon('chevron-up')}<span>${s.points} points</span></span><span class="hs-stat">${icon('message-circle')}<span>${s.comments} comments</span></span></span><button class="hs-share" data-action="share" data-id="${i}" aria-expanded="${shareId===i}">${icon('share-2')}Share</button></div>${sharePanel(i)}</article>`;}
  function feed(){let indices=stories.map((_,i)=>i).filter(i=>state.topic==='All stories'||stories[i].topic===state.topic);if(state.mode==='latest')indices.sort((a,b)=>stories[b].added.localeCompare(stories[a].added)||a-b);const topic=topicData.find(t=>t.name===state.topic);return `<header class="hs-intro"><div class="hs-kicker">${topic?'Topic':'Saturday, 26 September · The reading list'}</div><h1>${topic?esc(topic.name):'AI news for people who build.'}</h1><p>${topic?esc(topic.description):'AI news and highlights from the Hacker News discussion.'}</p></header><div class="hs-layout"><section aria-label="Story feed"><div class="hs-feedbar"><h2>${state.mode==='latest'?'Latest stories':topic?'In this topic':'Today’s top stories'}</h2><span>${indices.length} ${indices.length===1?'story':'stories'}${state.mode==='top'&&!topic?' · Ranked by HN points':''}</span></div>${indices.length?indices.map((i,n)=>row(i,n)).join(''):`<div class="hs-empty"><h2>No stories in this snapshot.</h2><p>There’s more to explore in the other topics.</p><button class="hs-button" data-action="home">Browse top stories ${icon('arrow-right')}</button></div>`}${indices.length?`<div class="hs-end"><button class="hs-button" data-action="nav" data-mode="topics">Browse topics ${icon('arrow-right')}</button></div>`:''}</section><aside class="hs-rail"><h2>Explore topics</h2>${topics()}<div class="hs-rail-note"><strong>About Hacksnap</strong><p>Summaries of AI stories and discussions from Hacker News, with links to the sources.</p></div></aside></div>`;}
  function directory(){return `<header class="hs-intro"><h1>Browse topics</h1><p>Stories grouped by subject.</p></header><div class="hs-topic-grid">${topicData.map(t=>`<button class="hs-topic-tile" data-action="topic" data-topic="${esc(t.name)}"><strong>${esc(t.name)}${icon('arrow-up-right')}</strong><span>${esc(t.description)}</span></button>`).join('')}</div>`;}
  function story(){const s=stories[state.story],i=state.story;const back=returnState.topic!=='All stories'?returnState.topic:returnState.mode==='latest'?'Latest stories':'Top stories';return `<article class="hs-detail"><div class="hs-detail-nav"><button class="hs-back" data-action="back">${icon('arrow-left')} ${esc(back)}</button><button class="hs-share" data-action="share" data-id="${i}" aria-expanded="${shareId===i&&shareLocation==='top'}">${icon('share-2')}Share</button></div><header class="hs-story-header"><div class="hs-context"><button class="hs-topic" data-action="topic" data-topic="${esc(s.topic)}">${esc(s.topic)}</button><span class="hs-dot"></span><a class="hs-source-domain" href="${s.original||'https://news.ycombinator.com/item?id='+s.id}" target="_blank" rel="noopener noreferrer">${esc(s.source)} ${icon('arrow-up-right')}</a><span class="hs-dot"></span><span>${s.minutes} min brief</span></div><h1>${esc(s.title)}</h1><p class="hs-deck">${esc(s.takeaway)}</p>${shareLocation==='top'?sharePanel(i):''}</header><section class="hs-article-section" aria-labelledby="hs-brief-title"><h2 id="hs-brief-title">TLDR;</h2><div class="hs-prose"><p>${esc(s.brief)}</p><ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div></section><section class="hs-article-section" id="hs-discussion" aria-labelledby="hs-discussion-title"><div class="hs-discussion-head"><h2 id="hs-discussion-title">Discussion</h2><span class="hs-label hs-skepticism" data-level="${s.skepticism.toLowerCase()}">${icon('message-circle')}<span>${s.skepticism} skepticism</span></span></div>${s.discussion.map(d=>`<section class="hs-discussion"><h3>${esc(d.title)}</h3><p>${esc(d.text)}</p><a href="https://news.ycombinator.com/item?id=${d.source||s.id}" target="_blank" rel="noopener noreferrer">${d.source?'Read source comment':'Read the HN discussion'} ↗</a></section>`).join('')}<div class="hs-actions"><button class="hs-share" data-action="share-bottom" data-id="${i}">${icon('share-2')}Share this story</button></div><div id="hs-bottom-share">${shareLocation==='bottom'?sharePanel(i):''}</div></section><section class="hs-next"><h2>Read next</h2><div class="hs-next-grid">${s.next.map(n=>`<a class="hs-next-item" href="${link(n)}" data-action="story" data-id="${n}"><small>${esc(stories[n].topic)}</small><strong>${esc(stories[n].title)}</strong><span>${stories[n].minutes} min brief →</span></a>`).join('')}</div><div class="hs-end"><button class="hs-button" data-action="topic" data-topic="${esc(s.topic)}">More in ${esc(s.topic)} ${icon('arrow-right')}</button></div></section></article>`;}
  function render(){root.dataset.phone=String(state.phone);root.dataset.density=state.density;root.style.colorScheme=state.appearance==='system'?'light dark':state.appearance;root.querySelectorAll('.hs-nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===(state.view==='topics'||state.topic!=='All stories'?'topics':state.mode))));const theme=root.querySelector('.hs-theme');theme.setAttribute('aria-label',`Switch to ${state.appearance==='dark'?'light':'dark'} mode`);theme.innerHTML=icon(state.appearance==='dark'?'sun':'moon');main.innerHTML=state.view==='story'?story():state.view==='topics'?directory():feed();if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
  function top(){requestAnimationFrame(()=>requestAnimationFrame(()=>root.scrollIntoView({block:'start',behavior:'instant'})));}
  root.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button||!root.contains(button))return;const action=button.dataset.action,i=Number(button.dataset.id);if((event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)&&button.tagName==='A')return;event.preventDefault();
    if(action==='copy-link'||action==='copy-post'){const panel=button.closest('.hs-share-panel');const text=action==='copy-link'?link(i):panel.querySelector('textarea').value;try{await navigator.clipboard.writeText(text);panel.querySelector('.hs-feedback').textContent=action==='copy-link'?'Link copied.':'Post copied.';}catch{panel.querySelector('textarea').value=text;panel.querySelector('textarea').focus();panel.querySelector('textarea').select();panel.querySelector('.hs-feedback').textContent='Select and copy the text above.';}return;}
    if(action==='discussion'){root.querySelector('#hs-discussion').scrollIntoView({block:'start',behavior:'instant'});return;}
    if(action==='share-bottom'){shareId=i;shareLocation='bottom';render();root.querySelector('#hs-bottom-share').scrollIntoView({block:'nearest',behavior:'instant'});root.querySelector('#hs-bottom-share .hs-share-close').focus();return;}
    if(action==='share'){shareLocation='top';shareId=shareId===i?null:i;render();if(shareId!==null)root.querySelector('.hs-share-close').focus();return;}
    if(action==='close-share'){const previous=shareId;const origin=shareLocation;shareId=null;render();root.querySelector(`[data-action="${origin==='bottom'?'share-bottom':'share'}"][data-id="${previous}"]`)?.focus();return;}
    shareId=null;
    if(action==='home'){state.view='feed';state.mode='top';state.topic='All stories';}
    if(action==='nav'){state.mode=button.dataset.mode;state.view=state.mode==='topics'?'topics':'feed';state.topic='All stories';}
    if(action==='topic'){state.topic=button.dataset.topic;state.view='feed';state.mode='top';}
    if(action==='story'){if(state.view!=='story'){returnState={mode:state.mode,topic:state.topic};returnStory=i;}state.view='story';state.story=i;}
    if(action==='back'){state.view='feed';state.mode=returnState.mode;state.topic=returnState.topic;}
    if(action==='theme'){state.appearance=state.appearance==='dark'?'light':'dark';}
    render();save();if(action==='back'&&returnStory!==null){requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelector(`[data-story-row="${returnStory}"]`)?.scrollIntoView({block:'start',behavior:'instant'})));}else if(action!=='theme')top();announce(state.view==='story'?stories[state.story].title:state.view==='topics'?'Explore topics':state.topic==='All stories'?'Story feed':state.topic);
  });
  root.addEventListener('keydown',event=>{if(event.key==='Escape'&&shareId!==null){const i=shareId;shareId=null;render();root.querySelector(`[data-action="share"][data-id="${i}"]`)?.focus();}});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){applySaved(event.detail.globals.widgetState);shareId=null;render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{shareId=null;render();save();}});tweak.addToggle(state,'phone',{label:'Phone layout'});tweak.addSelect(state,'appearance',{label:'Appearance',options:[{label:'Match app',value:'system'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});tweak.addToggle(state,'featured',{label:'Emphasize the lead story'});tweak.addSelect(state,'density',{label:'Feed spacing',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});}
})();
</script>
